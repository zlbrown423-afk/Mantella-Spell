; Living World VR haptics for OStim. Changes apply at the next scene start (no restart needed).
[Haptics]
; 1 on, 0 off
bEnabled=1
; strength of each impact, 0-100
iStrength=80
; length of one impact in milliseconds (shorter = sharper slap, longer = heavier thud)
iPulseMs=70
; 0 both hands, 1 right hand only, 2 left hand only
iHands=0
; 1 = only doggystyle / from-behind scenes, 0 = every scene OStim detects thrusts in
bRearEntryOnly=1
; 1 = one long rumble when OStim reports a climax during the scene
bClimax=1
iClimaxMs=700
; 1 = one long buzz right after a save loads, to check the controllers react at all
bTestPulseOnLoad=0
